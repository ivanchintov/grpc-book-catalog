syntax = "proto3";

package bookcatalog.v1;

option java_multiple_files = true;
option java_package = "io.github.ivanchintov.bookcatalog.proto";
option java_outer_classname = "BookCatalogProto";

enum Genre {
  GENRE_UNSPECIFIED = 0;
  SCIENCE_FICTION = 1;
  FANTASY = 2;
  MYSTERY = 3;
  THRILLER = 4;
  ROMANCE = 5;
  HISTORY = 6;
  BIOGRAPHY = 7;
  SPORTS = 8;
}

message Book {
  int64 id = 1;
  string title = 2;
  string author = 3;
  string isbn = 4;
  int32 publication_year = 5;
  Genre genre = 6;
}

message GetBookRequest {
  int64 id = 1;
}

message AddBookRequest {
  string title = 1;
  string author = 2;
  string isbn = 3;
  int32 publication_year = 4;
  Genre genre = 5;
}

service BookCatalog {
  rpc GetBook(GetBookRequest) returns (Book);
  rpc AddBook(AddBookRequest) returns (Book);
}